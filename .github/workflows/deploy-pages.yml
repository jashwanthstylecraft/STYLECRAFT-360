name: Deploy static UI shell to GitHub Pages

# Builds and publishes ONLY the client (client/dist) to GitHub Pages. Pages
# is static hosting — it cannot run the Express server in server/, so the
# published site has no working backend. Every page will show its own
# "Couldn't load ... data — the API is unreachable" error state; this
# deploy exists as a visual/UI preview only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client (base path = repo name, for the project-pages subpath)
        working-directory: client
        run: npx vite build --base=/STYLECRAFT-360/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
